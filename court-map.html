<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- From Leafletjs.com -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>


<!-- Map covers full screen (For now)-->
<style>
    #map {position: absolute; top: 0; bottom: 0; left: 0; right: 0;}
</style>


    
<title>Court Map</title>
</head>
<body>
    
    
<div id = "map"></div>
<script>



/// Center of map is Mimosa Hall, which is right in the middle of where the two represented courts are located. 


var center = [39.709974, -75.117575];




var bounds = L.latLngBounds(
    [center[0] - 0.001, center[1] - 0.0015],  // southwest corner
    [center[0] + 0.001, center[1] + 0.0015]   // northeast corner
);

var map = L.map('map', {
    maxBounds: bounds,
    maxBoundsViscosity: 1.0,
    minZoom: 18,
    maxZoom: 21
}).setView(center, 18);


//Tile layers from Maptiler (including attribution)

L.tileLayer('https://api.maptiler.com/maps/openstreetmap/{z}/{x}/{y}.jpg?key=tJwk9meS0E9ByXaEfPw7', {
    attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
}).addTo(map);


// Names and coordinates of the two courts

var courts = [
    {
        name: "Trail",
        coordinates: [39.709435, -75.116998]
    },
    {
        name: "Rec Center",
        coordinates: [39.710367073297384, -75.11807590270632]
    }
];


//places markers of the courts. 

courts.forEach(function(court) {
    L.marker(court.coordinates)
        .addTo(map)
        .bindPopup("<strong>" + court.name + "</strong>");
});


</script>

</body>
</html>
